name: LENOX iOS unsigned test build
on:
  push:
    branches: [prototype/ios-first-test-20261031]
    paths: ['ios/**', 'Tests/**', 'scripts/**', '.github/workflows/ios-test.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lenox-ios-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-test:
    if: github.repository == 'gilfillanjamie2000-del/Lenox-ios' && github.event.repository.private == false && github.ref == 'refs/heads/prototype/ios-first-test-20261031'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compile, test and package unsigned candidate
        run: bash scripts/ci-ios.sh
      - name: Retain compiled candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LENOX-iOS-UNSIGNED-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7
      - name: Retain diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LENOX-iOS-diagnostics-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 3
