name: LENOX iOS playlist persistence
on:
  push:
    branches: [feature/ios-playlist-persistence-20261031]
    paths: ['ios/**', 'Tests/**', 'scripts/**', 'docs/parity/**', '.github/workflows/ios-playlists.yml']
permissions:
  contents: read
concurrency:
  group: lenox-ios-playlists-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playlists:
    if: github.repository == 'gilfillanjamie2000-del/Lenox-ios' && github.event.repository.private == false && github.ref == 'refs/heads/feature/ios-playlist-persistence-20261031'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify playlist saving, relaunch and native playback
        run: bash scripts/ci-playlists.sh
      - name: Retain unsigned candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LENOX-iOS-PLAYLISTS-UNSIGNED-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LENOX-iOS-playlist-diagnostics-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 3
